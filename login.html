  <main id="main" class="auth-main">
    <a class="auth-home" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>Home</a>

    <div class="auth-center">
      <div class="auth-card">
        <a class="auth-logo" href="index.html"><img src="assets/brand/logo.png" alt="ManaGEM home" width="137" height="24"></a>
        <div class="auth-head">
          <h1>Log in to ManaGEM</h1>
          <p>Welcome back. Enter your username and password to continue.</p>
        </div>

        <form id="loginForm" class="auth-form" method="post" action="https://app.managem.co.za/" novalidate>
          <div class="auth-field">
            <label for="l-user">Username</label>
            <div class="auth-input">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
              <input id="l-user" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required aria-describedby="l-user-err">
            </div>
            <p class="auth-err" id="l-user-err" hidden>Enter your username.</p>
          </div>
          <div class="auth-field">
            <label for="l-pass">Password</label>
            <div class="auth-input">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
              <input id="l-pass" name="password" type="password" autocomplete="current-password" required aria-describedby="l-pass-err">
              <button class="auth-reveal" type="button" aria-controls="l-pass" aria-pressed="false" aria-label="Show password">
                <svg class="i-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="i-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4M6.6 6.6A17 17 0 0 0 2 12s3.6 7 10 7a10 10 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
              </button>
            </div>
            <p class="auth-err" id="l-pass-err" hidden>Enter your password.</p>
          </div>
          <div class="auth-row">
            <label class="auth-check"><input type="checkbox" name="remember" value="1"><span class="auth-box" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>Remember me</label>
            <a class="auth-link" href="support.html?topic=password#ticket">Forgot password?</a>
          </div>
          <button class="btn btn-primary btn-lg btn-block" type="submit">Log in</button>
          <p class="auth-status" role="status" aria-live="polite"></p>
        </form>

        <div class="auth-divider" role="presentation"><span>or</span></div>

        <a class="btn btn-outline btn-lg btn-block" href="reference/product/managem-app.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4M10 8.5l4 2.5-4 2.5z"/></svg>Try the demo</a>

        <p class="auth-signup">Don’t have an account? <a class="auth-link" href="https://app.managem.co.za/signup" data-signup>Start free trial</a></p>
      </div>
